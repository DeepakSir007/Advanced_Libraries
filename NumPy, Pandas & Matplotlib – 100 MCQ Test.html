<div id="start" class="c">
<h1>Python for Data Science – 100 MCQ Test</h1>
<p class="mu">NumPy (40) · Pandas (37) · Matplotlib (23). Each question carries 1 mark; there is no negative marking. Pass mark: 40%.</p>

<script>
// [question, correct, wrong1, wrong2, wrong3]  — 1-40 NumPy, 41-77 Pandas, 78-100 Matplotlib
const D=[

["A Pandas DataFrame is:","A two-dimensional table of rows and columns","A single list","A 1-D array only","A plot type"],

["df['col2'].apply(lambda x: x*2) does:","Applies the function to every value of the column","Multiplies the whole DataFrame","Drops the column","Sorts the column"],

const sec=i=>i<40?'NumPy':i<77?'Pandas':'Matplotlib';
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const Q=D.map(d=>{const o=d.slice(1).map((t,k)=>({t,c:!k}));for(let k=3;k>0;k--){const j=Math.floor(rnd()*(k+1));[o[k],o[j]]=[o[j],o[k]];}return{q:d[0],o,a:-1};});
const $=id=>document.getElementById(id),ab='ABCD';let name='';
$('go').onclick=()=>{name=$('nm').value.trim();if(!name){$('nw').textContent='Please enter your name.';return;}
 $('who').textContent=name;$('start').classList.add('hide');$('test').classList.remove('hide');window.scrollTo(0,0);};
const L=$('L');
Q.forEach((x,i)=>{const c=document.createElement('div');c.className='c q';
 c.innerHTML='<h3></h3>';c.firstChild.textContent=(i+1)+'. '+x.q;
 x.o.forEach((o,k)=>{const l=document.createElement('label');l.className='o';
  const r=document.createElement('input');r.type='radio';r.name='q'+i;
  r.onchange=()=>{x.a=k;$('prog').textContent='Answered '+Q.filter(z=>z.a>=0).length+' / 100';};
  l.append(r,ab[k]+') '+o.t);c.appendChild(l);});
 L.appendChild(c);});
let warned=false;
$('sub').onclick=()=>{
 const left=Q.filter(z=>z.a<0).length;
 if(left&&!warned){warned=true;$('sw').textContent=left+' unanswered. Click Submit again to finish anyway.';return;}
 finish();};
function finish(){
 let s=0;const t={NumPy:[0,0],Pandas:[0,0],Matplotlib:[0,0]};
 Q.forEach((x,i)=>{const ok=x.a>=0&&x.o[x.a].c;if(ok)s++;t[sec(i)][1]++;if(ok)t[sec(i)][0]++;});
 const p=s,pass=p>=40;
 let h='<div class="c"><h1>Result – '+esc(name)+'</h1><p class="big">'+s+' / 100</p>'
  +'<p><span class="pill" style="background:'+(pass?'var(--okb)':'var(--badb)')+';color:'+(pass?'var(--ok)':'var(--bad)')+'">'+(pass?'PASS':'FAIL')+'</span> &nbsp; '
  +p+'% · '+grade(p)+'</p><p class="mu">Correct: '+s+' · Wrong: '+Q.filter(z=>z.a>=0&&!z.o[z.a].c).length+' · Unanswered: '+Q.filter(z=>z.a<0).length+'</p></div>';
 h+='<div class="c"><h2 style="margin-top:0">Topic-wise score</h2><table><tr><th>Topic</th><th>Score</th><th>%</th></tr>';
 for(const k in t)h+='<tr><td>'+k+'</td><td>'+t[k][0]+' / '+t[k][1]+'</td><td>'+Math.round(t[k][0]/t[k][1]*100)+'%</td></tr>';
 h+='</table></div><h2>Answer review</h2>';
 Q.forEach((x,i)=>{h+='<div class="c"><h3 style="font-size:1rem;margin:0 0 8px">'+(i+1)+'. '+esc(x.q)+'</h3>';
  x.o.forEach((o,k)=>{const cl=o.c?'ok':(k===x.a?'no':'');
   h+='<div class="o '+cl+'">'+ab[k]+') '+esc(o.t)+(o.c?' ✓':'')+(k===x.a&&!o.c?' ✗ (your answer)':'')+'</div>';});
  if(x.a<0)h+='<p class="mu" style="margin:6px 0 0">Not answered</p>';h+='</div>';});
 h+='<div class="c"><button onclick="location.reload()">Retake Test</button></div>';
 $('test').classList.add('hide');$('res').innerHTML=h;$('res').classList.remove('hide');window.scrollTo(0,0);}
function grade(p){return p>=90?'Grade A+ (Outstanding)':p>=75?'Grade A (Excellent)':p>=60?'Grade B (Good)':p>=40?'Grade C (Average)':'Grade D (Needs improvement)';}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
</script></body></html>
